<title>NEWCATSLE × 뉴엔터 윷놀이 테스트 v3</title>
<style>
:root{--bg:#08070d;--panel:#15111f;--border:#43384d;--purple:#b16cff;--text:#f7f2fb;--muted:#a99db5}
*{box-sizing:border-box}
body{margin:0;background:#07060b;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Pretendard,Arial,sans-serif}
button,input{font:inherit}
button{touch-action:manipulation}
.app{max-width:1600px;margin:auto;padding:12px}
.tabs{display:flex;gap:8px;position:sticky;top:0;z-index:80;padding:8px 0 12px;background:#07060be8;backdrop-filter:blur(12px)}
.tab{min-height:46px;border:1px solid var(--border);border-radius:11px;background:#15111f;color:#fff;padding:0 18px;font-weight:900}
.tab.active{border-color:var(--purple);background:#2a1a3a}
.screen{display:none}.screen.active{display:block}
.panel{border:1px solid var(--border);border-radius:16px;background:var(--panel);padding:14px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;border:1px solid var(--border);border-radius:10px;background:#1c1626;color:#fff;padding:0 14px;font-weight:900}
.btn.primary{border-color:var(--purple);background:#40265a}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.setup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.setup{border:1px solid var(--border);border-radius:12px;background:#100d17;padding:10px}
.setup b{display:block;font-size:12px;margin-bottom:7px}
.setup-slot{width:100%;min-height:46px;border:1px solid var(--border);border-radius:9px;background:#18131f;color:#fff;padding:0 12px;font-size:15px;font-weight:900;text-align:left}
.setup-slot+.setup-slot{margin-top:7px}
.setup-slot:hover,.setup-slot:focus{border-color:var(--purple);outline:none}
.team-picker{margin-top:12px;border:1px solid #604878;border-radius:14px;background:#100c18;padding:12px}
.team-picker.hidden{display:none}
.picker-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.picker-head b{font-size:13px}
.picker-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.picker-team{min-height:42px;border:1px solid var(--border);border-radius:9px;background:#21182c;color:#fff;padding:0 8px;font-size:12px;font-weight:900}
.picker-team.current{border-color:var(--purple);background:#4b2a67}
@media(max-width:760px){.picker-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.round-card{margin-top:12px}
.round-card h3{font-size:15px;margin:0 0 8px}
.control-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.cmatch{border:1px solid var(--border);border-radius:11px;background:#100d17;padding:9px}
.cmatch small{display:block;color:var(--muted);margin-bottom:6px}
.team-btn{width:100%;min-height:44px;border:1px solid var(--border);border-radius:9px;background:#18131f;color:#fff;text-align:left;padding:0 12px;font-weight:900}
.team-btn+.team-btn{margin-top:6px}
.team-btn.win{border-color:var(--purple);background:#4b2a67}
.team-btn.lose{opacity:.28}
.team-btn:disabled{opacity:.28}

 position:absolute;z-index:20;display:flex;align-items:center;justify-content:center;

 .setup-grid,.control-grid{grid-template-columns:1fr}
 .app{padding:8px}

<body>
<div class="app">
  <div class="tabs">
    <button class="tab active" id="tabControl">조작 화면</button>
    <button class="tab" id="tabBroadcast">방송 화면</button>
  </div>

  <section class="screen active" id="controlScreen">
    <div class="panel" id="setupPanel">
      <div class="topline">
        <div>
          <div style="font-size:18px;font-weight:1000">16강 대진 설정</div>
          <div class="hint">팀칸을 눌러 16개 팀 중에서 선택하고 대진을 맞춘 뒤 시작을 눌러.</div>
        </div>
        <div class="actions">
          <button class="btn primary" id="startBtn">시작</button>
          <button class="btn" id="resetBtn">초기화</button>
        </div>
      </div>
      <div class="setup-grid" id="setupGrid"></div>
      <div class="team-picker hidden" id="teamPicker">
        <div class="picker-head">
          <b id="pickerTitle">팀 선택</b>
          <button class="btn" id="closePicker" type="button">닫기</button>
        </div>
        <div class="picker-grid" id="pickerGrid"></div>
      </div>
    </div>

    <div class="panel" id="runPanel" style="display:none">
      <div class="topline">
        <div>
          <div style="font-size:18px;font-weight:1000">경기 진행</div>
          <div class="hint">경기 끝난 순서대로 이긴 팀만 눌러.</div>
        </div>
        <div id="controlProgress" style="font-weight:1000">16강 결과 0 / 8 완료</div>
      </div>
      <div class="actions" style="margin-top:12px">
        <button class="btn" id="undoBtn">직전 결과 취소</button>
        <button class="btn" id="editBtn">대진 다시 설정</button>
      </div>
      <div id="controlRounds"></div>
    </div>
  </section>

  <section class="screen" id="broadcastScreen">
    <div class="broadcast-scroll">
      <div class="board" id="board">
        <svg class="live-svg" viewBox="0 0 1536 864" id="liveSvg"></svg>
      </div>
    </div>
    <div class="note">방송화면 배경은 지정한 이미지 자체를 그대로 사용하고 결과와 팀명만 위에 실시간으로 반영해.</div>
  </section>
</div>

<script>
(()=>{
const defaults=['트슈 · 단솔','니코 · 하윤','듀듀 · 미스','냥코 · 으니','뉴다 · 복실','도랑 · 재욱','아송 · 쫑알','막현 · 퀸주','아깽 · 대휘','키링 · 갑숙','봉구 · 빵지니','난강 · 밍또','유즈 · 성균','건욱 · 키키','액구 · 유성','두링 · 성준'];
let teams=[...defaults], results={}, history=[];

try{
 const s=JSON.parse(localStorage.getItem('nc_yut_exact_v2')||'null');
 if(s&&Array.isArray(s.teams)&&s.teams.length===16)teams=s.teams;
 if(s&&s.results)results=s.results;
}catch(e){}
const save=()=>localStorage.setItem('nc_yut_exact_v2',JSON.stringify({teams,results}));

function match(key){
 if(/^L16_/.test(key)){const i=+key.split('_')[1];return[teams[i*2],teams[i*2+1]]}
 if(/^R16_/.test(key)){const i=+key.split('_')[1];return[teams[8+i*2],teams[8+i*2+1]]}
 if(/^L8_/.test(key)){const i=+key.split('_')[1];return[results['L16_'+i*2]||'',results['L16_'+(i*2+1)]||'']}
 if(/^R8_/.test(key)){const i=+key.split('_')[1];return[results['R16_'+i*2]||'',results['R16_'+(i*2+1)]||'']}
 if(key==='L4')return[results.L8_0||'',results.L8_1||''];
 if(key==='R4')return[results.R8_0||'',results.R8_1||''];
 if(key==='FINAL')return[results.L4||'',results.R4||''];
 if(key==='THIRD')return[loser('L4'),loser('R4')];
 return['',''];
}
function loser(key){
 const m=match(key),w=results[key]; if(!m[0]||!m[1]||!w)return'';
 return m[0]===w?m[1]:m[0];
}
function downstream(key){
 if(key.startsWith('L16_'))return['L8_'+Math.floor((+key.split('_')[1])/2),'L4','FINAL','THIRD'];
 if(key.startsWith('R16_'))return['R8_'+Math.floor((+key.split('_')[1])/2),'R4','FINAL','THIRD'];
 if(key.startsWith('L8_'))return['L4','FINAL','THIRD'];
 if(key.startsWith('R8_'))return['R4','FINAL','THIRD'];
 if(key==='L4'||key==='R4')return['FINAL','THIRD'];
 return[];
}
function choose(key,t){
 if(!t||!match(key).includes(t))return;
 history.push(JSON.stringify(results));
 downstream(key).forEach(k=>delete results[k]);
 results[key]=t; save(); renderAll();
}

let pickerIndex=null;
function buildSetup(){
 const g=document.getElementById('setupGrid');g.innerHTML='';
 for(let i=0;i<8;i++){
  const d=document.createElement('div');d.className='setup';
  const title=document.createElement('b');title.textContent=(i+1)+'경기';d.appendChild(title);
  [i*2,i*2+1].forEach(idx=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='setup-slot';
    b.textContent=teams[idx];
    b.addEventListener('click',()=>openTeamPicker(idx));
    d.appendChild(b);
  });
  g.appendChild(d);
 }
}
function openTeamPicker(index){
 pickerIndex=index;
 const picker=document.getElementById('teamPicker');
 document.getElementById('pickerTitle').textContent=(Math.floor(index/2)+1)+'경기 · '+(index%2===0?'위 팀':'아래 팀')+' 선택';
 const grid=document.getElementById('pickerGrid');grid.innerHTML='';
 defaults.forEach(name=>{
   const b=document.createElement('button');
   b.type='button';
   b.className='picker-team'+(teams[index]===name?' current':'');
   b.textContent=name;
   b.addEventListener('click',()=>{
     const other=teams.indexOf(name);
     const old=teams[index];
     if(other>=0 && other!==index) teams[other]=old;
     teams[index]=name;
     save();
     picker.classList.add('hidden');
     buildSetup();
     renderBroadcast();
   });
   grid.appendChild(b);
 });
 picker.classList.remove('hidden');
}
document.getElementById('closePicker').addEventListener('click',()=>document.getElementById('teamPicker').classList.add('hidden'));
function addRound(title,defs){
 const sec=document.createElement('div');sec.className='panel round-card';
 sec.innerHTML=`<h3>${title}</h3>`;
 const grid=document.createElement('div');grid.className='control-grid';
 defs.forEach(([key,label])=>{
  const c=document.createElement('div');c.className='cmatch';c.innerHTML=`<small>${label}</small>`;

function teamFor(id){
 if(/^L\d$/.test(id))return teams[+id.slice(1)];
 if(/^R\d$/.test(id))return teams[8+(+id.slice(1))];
 if(/^LQ\d$/.test(id))return results['L16_'+(+id.slice(2))]||'승자';
 if(/^RQ\d$/.test(id))return results['R16_'+(+id.slice(2))]||'승자';
 if(id==='LS0')return results.L8_0||'승자';
 if(id==='LS1')return results.L8_1||'승자';
 if(id==='RS0')return results.R8_0||'승자';
 if(id==='RS1')return results.R8_1||'승자';
 if(id==='LF')return results.L4||'승자';
 if(id==='RF')return results.R4||'승자';
 return'';
}
function keyFor(id){
 if(/^L\d$/.test(id))return'L16_'+Math.floor((+id.slice(1))/2);
 if(/^R\d$/.test(id))return'R16_'+Math.floor((+id.slice(1))/2);
 if(/^LQ\d$/.test(id))return'L8_'+Math.floor((+id.slice(2))/2);
 if(/^RQ\d$/.test(id))return'R8_'+Math.floor((+id.slice(2))/2);
 if(/^LS\d$/.test(id))return'L4';
 if(/^RS\d$/.test(id))return'R4';
 return'';
}
function activeSet(){
 const s=new Set();
 for(let i=0;i<4;i++){
  let m=match('L16_'+i),w=results['L16_'+i]; if(w)s.add('L16'+(w===m[0]?'a':'b')+i);
  m=match('R16_'+i);w=results['R16_'+i]; if(w)s.add('R16'+(w===m[0]?'a':'b')+i);
 }
 for(let i=0;i<2;i++){
  let m=match('L8_'+i),w=results['L8_'+i]; if(w)s.add('L8'+(w===m[0]?'a':'b')+i);
  m=match('R8_'+i);w=results['R8_'+i]; if(w)s.add('R8'+(w===m[0]?'a':'b')+i);
 }
 let m=match('L4'),w=results.L4;if(w)s.add('L4'+(w===m[0]?'a':'b'));
 m=match('R4');w=results.R4;if(w)s.add('R4'+(w===m[0]?'a':'b'));
 return s;
}
function renderBroadcast(){
 ['L0','L1','L2','L3','L4','L5','L6','L7','R0','R1','R2','R3','R4','R5','R6','R7',
  'LQ0','LQ1','LQ2','LQ3','RQ0','RQ1','RQ2','RQ3','LS0','LS1','RS0','RS1'].forEach(id=>{
   const el=overlays[id],t=teamFor(id),key=keyFor(id);el.textContent=t;
   el.classList.remove('win','lose');
   const m=match(key); if(results[key]&&m.includes(t))el.classList.add(results[key]===t?'win':'lose');
  });
 overlays.LF.textContent=teamFor('LF'); overlays.RF.textContent=teamFor('RF');
 overlays.LF.classList.remove('win','lose');overlays.RF.classList.remove('win','lose');
 if(results.L4)overlays.LF.classList.add('win'); if(results.R4)overlays.RF.classList.add('win');

 const th=match('THIRD'); overlays.TL.textContent=th[0]||'승자'; overlays.TR.textContent=th[1]||'승자';
 overlays.TL.classList.toggle('win',results.THIRD===th[0]&&!!th[0]); overlays.TR.classList.toggle('win',results.THIRD===th[1]&&!!th[1]);

 const n=Object.keys(results).filter(k=>k.startsWith('L16_')||k.startsWith('R16_')).length;
 overlays.PROG.textContent=`결과 ${n} / 8 완료`;

 const act=activeSet();Object.entries(lines).forEach(([id,p])=>p.classList.toggle('on',act.has(id)));
}

<script id="auto-update-watcher">
(() => {
  const CHECK_MS = 30000;
  const currentVersion = document.querySelector('meta[name="app-version"]')?.content || '';
  async function checkForUpdate() {
    try {
      const url = new URL(location.pathname, location.origin);
      url.searchParams.set('_update_check', Date.now().toString());
      const res = await fetch(url.toString(), { cache: 'no-store' });
      if (!res.ok) return;
      const html = await res.text();
      const m = html.match(/<meta\s+name=["']app-version["']\s+content=["']([^"']+)["']/i);
      const remoteVersion = m ? m[1] : '';
      if (remoteVersion && currentVersion && remoteVersion !== currentVersion) {
        location.replace(url.pathname + '?v=' + encodeURIComponent(remoteVersion));
      }
    } catch (e) {}
  }
  setTimeout(checkForUpdate, 5000);
  setInterval(checkForUpdate, CHECK_MS);
})();
</script>\n</body>
