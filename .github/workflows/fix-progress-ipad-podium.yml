name: Fix progress and iPad podium

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-progress-ipad-podium.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          # Version bump
          s=re.sub(r'v2026\.10\.03\.\d+', 'v2026.10.03.10', s)
          s=re.sub(r"const APP_VERSION='2026\.10\.03\.\d+';", "const APP_VERSION='2026.10.03.10';", s)

          # Fix top-right dynamic result text: completely cover the baked-in second line,
          # then draw one clean dynamic line on top.
          css = """<style id="progress-ipad-fix">
          #ov-PROG{
            left:1300px!important;
            top:154px!important;
            width:205px!important;
            height:34px!important;
            background:rgba(19,15,29,.985)!important;
            color:#fff!important;
            font-size:17px!important;
            font-weight:950!important;
            text-shadow:0 1px 2px #000!important;
            border-radius:0!important;
            overflow:hidden!important;
          }
          </style>"""
          if 'id="progress-ipad-fix"' not in s:
              s=s.replace('</head>', css+'\n</head>')

          # Ensure the progress overlay is not constrained by an older inline position.
          s=re.sub(
              r"ov\('PROG'\s*,\s*\d+\s*,\s*\d+\s*,\s*\d+\s*,\s*\d+\s*,\s*'progress'\);",
              "ov('PROG',1300,154,205,34,'progress');",
              s
          )

          # iPad: if final results are decided while the broadcast tab is hidden,
          # defer the 9-second overlay until the user actually opens Broadcast.
          if "let podiumPending=false;" not in s:
              s=s.replace("let podiumTimer=null;", "let podiumTimer=null;\n          let podiumPending=false;", 1)

          old_show = """function showPodium(force=false){
            const {first,second,third}=getPodium();
            if(!first||!second||!third)return;
            const sig=first+'|'+second+'|'+third;
            if(!force && sig===lastPodiumSignature)return;
            lastPodiumSignature=sig;
            document.getElementById('podium1').textContent=first;
            document.getElementById('podium2').textContent=second;
            document.getElementById('podium3').textContent=third;
            const el=document.getElementById('podiumPopup');
            el.classList.add('show');
            if(podiumTimer)clearTimeout(podiumTimer);
            podiumTimer=setTimeout(()=>el.classList.remove('show'),9000);
          }"""
          new_show = """function showPodium(force=false){
            const {first,second,third}=getPodium();
            if(!first||!second||!third)return;
            const sig=first+'|'+second+'|'+third;
            const broadcastVisible=document.getElementById('broadcastScreen')?.classList.contains('active');
            if(!force && !broadcastVisible){
              podiumPending=true;
              return;
            }
            if(!force && sig===lastPodiumSignature)return;
            lastPodiumSignature=sig;
            podiumPending=false;
            document.getElementById('podium1').textContent=first;
            document.getElementById('podium2').textContent=second;
            document.getElementById('podium3').textContent=third;
            const el=document.getElementById('podiumPopup');
            el.classList.add('show');
            if(podiumTimer)clearTimeout(podiumTimer);
            podiumTimer=setTimeout(()=>el.classList.remove('show'),9000);
          }"""
          if old_show in s:
              s=s.replace(old_show,new_show,1)
          elif "function showPodium(force=false)" in s and "broadcastVisible" not in s:
              # Regex fallback for formatting differences
              s=re.sub(
                  r"function showPodium\(force=false\)\{.*?\n\s*\}",
                  new_show,
                  s,
                  count=1,
                  flags=re.S
              )

          # When the broadcast tab is opened, show any pending podium and start its timer then.
          old_show_tab = """if(!control)renderBroadcast();"""
          new_show_tab = """if(!control){
   renderBroadcast();
   if(typeof podiumPending!=='undefined' && podiumPending){
     setTimeout(()=>showPodium(true),80);
   }
 }"""
          if old_show_tab in s and "setTimeout(()=>showPodium(true),80)" not in s:
              s=s.replace(old_show_tab,new_show_tab,1)

          # If results are undone/reset, clear pending popup too.
          s=s.replace(
              "if(el) el.classList.remove('show');",
              "if(el) el.classList.remove('show');\n            podiumPending=false;",
              1
          )

          p.write_text(s,encoding="utf-8")
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix result counter and iPad podium popup"
          git push
