name: Add final podium popup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/final-podium-popup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch final podium popup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          # Version bump.
          s=re.sub(r'v2026\.10\.03\.\d+', 'v2026.10.03.9', s)
          s=re.sub(r"const APP_VERSION='2026\.10\.03\.\d+';", "const APP_VERSION='2026.10.03.9';", s)

          # Remove the old always-visible bottom ranking strip if it exists.
          s=re.sub(r'<style id="final-ranking-style">.*?</style>', '', s, flags=re.S)
          s=re.sub(r'<div class="final-ranking" id="finalRanking">.*?</div>\s*</div>\s*</div>\s*</div>', '', s, count=1, flags=re.S)
          # More conservative fallback for minified single-line markup.
          s=re.sub(r'<div class="final-ranking" id="finalRanking">.*?<span class="rank-team" id="rank3Team">-</span></div></div>', '', s, count=1, flags=re.S)

          css = """<style id="final-podium-popup-style">
          .podium-popup{
            position:absolute;inset:0;z-index:60;display:none;
            align-items:center;justify-content:center;
            background:rgba(4,3,8,.76);backdrop-filter:blur(3px);
          }
          .podium-popup.show{display:flex;animation:podiumFade .28s ease-out}
          .podium-wrap{
            width:980px;max-width:86%;padding:34px 38px 30px;
            border:1px solid rgba(213,190,239,.42);border-radius:24px;
            background:linear-gradient(180deg,rgba(36,27,50,.97),rgba(14,11,21,.97));
            box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 34px rgba(152,93,218,.22);
            text-align:center;
          }
          .podium-title{font-size:20px;font-weight:1000;letter-spacing:.14em;color:#d7c4ec;margin-bottom:24px}
          .podium-grid{display:grid;grid-template-columns:1fr 1.28fr 1fr;gap:18px;align-items:end}
          .podium-card{
            min-height:170px;border-radius:18px;padding:20px 16px;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            background:rgba(20,16,29,.96);
          }
          .podium-card.first{
            min-height:220px;border:2px solid #e3bd64;
            box-shadow:0 0 30px rgba(227,189,100,.25);
          }
          .podium-card.second{border:2px solid #bfc4d2}
          .podium-card.third{border:2px solid #bc7a54}
          .podium-crown{font-size:42px;line-height:1;margin-bottom:8px;color:#f1c96e}
          .podium-rank{font-size:25px;font-weight:1000;margin-bottom:12px}
          .podium-card.first .podium-rank{color:#f1c96e;font-size:32px}
          .podium-card.second .podium-rank{color:#d5d9e3}
          .podium-card.third .podium-rank{color:#d69066}
          .podium-team{
            width:100%;font-size:24px;font-weight:1000;color:#fff;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
          }
          .podium-card.first .podium-team{font-size:30px}
          .podium-sub{margin-top:22px;font-size:12px;color:#9588a3;font-weight:800;letter-spacing:.08em}
          @keyframes podiumFade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
          </style>"""
          if 'id="final-podium-popup-style"' not in s:
              s=s.replace('</head>', css+'\n</head>')

          popup = """<div class="podium-popup" id="podiumPopup">
            <div class="podium-wrap">
              <div class="podium-title">FINAL RESULT</div>
              <div class="podium-grid">
                <div class="podium-card second">
                  <div class="podium-rank">2위</div>
                  <div class="podium-team" id="podium2">-</div>
                </div>
                <div class="podium-card first">
                  <div class="podium-crown">♛</div>
                  <div class="podium-rank">1위</div>
                  <div class="podium-team" id="podium1">-</div>
                </div>
                <div class="podium-card third">
                  <div class="podium-rank">3위</div>
                  <div class="podium-team" id="podium3">-</div>
                </div>
              </div>
              <div class="podium-sub">NEWCATSLE × 뉴엔터 · 도랑배 윷놀이대회</div>
            </div>
          </div>"""
          if 'id="podiumPopup"' not in s:
              marker='<div class="board-version">'
              if marker in s:
                  s=s.replace(marker, popup+'\n        '+marker, 1)

          # Add replay button to the control screen.
          replay='<button class="btn" id="replayPodiumBtn" type="button">최종 결과 팝업 다시보기</button>'
          if 'id="replayPodiumBtn"' not in s:
              marker='<button class="btn" id="editBtn" type="button">대진 다시 설정</button>'
              if marker in s:
                  s=s.replace(marker, marker+replay, 1)

          # Add popup state/functions after the save function.
          js = """let podiumTimer=null;
          let lastPodiumSignature='';
          function getPodium(){
            const f=match('FINAL');
            const first=started?(results.FINAL||''):'';
            const second=started&&first&&f[0]&&f[1]?(first===f[0]?f[1]:f[0]):'';
            const third=started?(results.THIRD||''):'';
            return {first,second,third};
          }
          function hidePodium(){
            const el=document.getElementById('podiumPopup');
            if(el) el.classList.remove('show');
            if(podiumTimer){clearTimeout(podiumTimer);podiumTimer=null;}
          }
          function showPodium(force=false){
            const {first,second,third}=getPodium();
            if(!first||!second||!third)return;
            const sig=first+'|'+second+'|'+third;
            if(!force && sig===lastPodiumSignature)return;
            lastPodiumSignature=sig;
            document.getElementById('podium1').textContent=first;
            document.getElementById('podium2').textContent=second;
            document.getElementById('podium3').textContent=third;
            const el=document.getElementById('podiumPopup');
            el.classList.add('show');
            if(podiumTimer)clearTimeout(podiumTimer);
            podiumTimer=setTimeout(()=>el.classList.remove('show'),9000);
          }
          """
          save_marker="const save=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify({teams,results,started}));"
          if 'function getPodium()' not in s and save_marker in s:
              s=s.replace(save_marker, save_marker+'\n'+js, 1)

          # Trigger popup when both final and third-place results are complete.
          render_target=" const act=activeSet();Object.entries(lines).forEach(([id,p])=>p.classList.toggle('on',act.has(id)));"
          if render_target in s and "showPodium(false);" not in s:
              s=s.replace(render_target, " const podium=getPodium(); if(podium.first&&podium.second&&podium.third){showPodium(false);} else {hidePodium(); lastPodiumSignature='';}"+render_target, 1)

          # Replay button.
          if "replayPodiumBtn').addEventListener" not in s:
              listener="document.getElementById('replayPodiumBtn').addEventListener('click',()=>{show(false);setTimeout(()=>showPodium(true),50);});"
              tab_marker="document.getElementById('tabControl').addEventListener('click',()=>show(true));"
              if tab_marker in s:
                  s=s.replace(tab_marker, listener+'\n'+tab_marker, 1)

          p.write_text(s,encoding="utf-8")
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Show final podium popup"
          git push
