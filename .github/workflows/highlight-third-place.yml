name: Highlight third place winner

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/highlight-third-place.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("v2026.10.03.6","v2026.10.03.7")
          s=s.replace("2026.10.03.6","2026.10.03.7")
          marker='</head>'
          css='<style id="third-place-highlight">#ov-TL.win,#ov-TR.win{color:#ffe6a3!important;font-weight:1000!important;text-shadow:0 0 10px rgba(244,190,78,.98),0 1px 2px #000!important}#ov-TL.lose,#ov-TR.lose{opacity:.25!important}</style>'
          if 'id="third-place-highlight"' not in s:
              s=s.replace(marker,css+marker)
          old="overlays.TL.classList.toggle('win',started && results.THIRD===th[0]&&!!th[0]); overlays.TR.classList.toggle('win',started && results.THIRD===th[1]&&!!th[1]);"
          new=old+" overlays.TL.classList.toggle('lose',started && !!results.THIRD && results.THIRD!==th[0] && !!th[0]); overlays.TR.classList.toggle('lose',started && !!results.THIRD && results.THIRD!==th[1] && !!th[1]);"
          if old in s and "classList.toggle('lose',started && !!results.THIRD" not in s:
              s=s.replace(old,new)
          oldtxt="overlays.TL.textContent=started ? (th[0]||'') : ''; overlays.TR.textContent=started ? (th[1]||'') : '';"
          newtxt="overlays.TL.textContent=started ? (th[0] ? ((results.THIRD===th[0]?'3위 · ':'')+th[0]) : '') : ''; overlays.TR.textContent=started ? (th[1] ? ((results.THIRD===th[1]?'3위 · ':'')+th[1]) : '') : '';"
          s=s.replace(oldtxt,newtxt)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Highlight third place winner"
          git push
