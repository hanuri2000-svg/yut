name: Patch broadcast overlay styling

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-broadcast.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch broadcast overlay CSS
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              '<meta name="app-version" content="2026.10.03.3">',
              '<meta name="app-version" content="2026.10.03.4">'
          )
          s = s.replace(
              '.ov.win{background:rgba(68,37,96,.98);box-shadow:0 0 12px rgba(177,108,255,.65);color:#fff}',
              '.ov.win{background:transparent;box-shadow:none;color:#fff;text-shadow:0 0 8px rgba(177,108,255,.95),0 1px 2px #000}'
          )
          s = s.replace(
              '.ov.progress{background:rgba(20,16,30,.92);font-size:17px;border-radius:0}',
              '.ov.progress{background:transparent;font-size:17px;border-radius:0}'
          )
          s = s.replace(
              '.live-line{fill:none;stroke:transparent;stroke-width:7;filter:drop-shadow(0 0 6px #b16cff)}',
              '.live-line{fill:none;stroke:transparent;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #b16cff)}'
          )
          p.write_text(s, encoding="utf-8")

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Clean broadcast overlay styling"
          git push
